name: post-queue
# Posts what the routine queued. Triggered only by pushes that touch queue/,
# never by pull requests, so fork PRs cannot reach the bot token.
on:
  push:
    paths: ["queue/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: post-queue
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post queued replies and reviews
        env:
          GH_TOKEN: ${{ secrets.ZOBOTH_TOKEN }}
        run: python3 bot.py post-queue
      - name: Drop handled items
        if: always()
        run: |
          git config user.name zoboth
          git config user.email zoboth@users.noreply.github.com
          git add -A queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -qm "Clear handled queue items"
          if [ "${GITHUB_REF_NAME}" = main ]; then
            git push -q origin HEAD:main
          elif [ -z "$(ls queue/*.json 2>/dev/null)" ]; then
            git push -q origin --delete "${GITHUB_REF_NAME}"
          else
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
